name: Publish

on:
  push:
    branches:
      - prod

jobs:
  pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphviagent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check PyPI version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://pypi.org/pypi/graphviagent/${VERSION}/json" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "graphviagent $VERSION is already on PyPI; skip upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "graphviagent $VERSION is new; publish"
          fi

      - name: Publish
        if: steps.version.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
