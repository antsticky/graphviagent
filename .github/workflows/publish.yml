name: Publish

on:
  push:
    branches:
      - prod

jobs:
  pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/graphviagent
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Read version and notes
        id: version
        run: |
          python <<'PY'
          import os, re, tomllib, urllib.request
          from pathlib import Path

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)",
              changelog,
              re.M | re.S,
          )
          notes = match.group(0).strip() if match else f"graphviagent {version}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")

          exists = False
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/graphviagent/{version}/json")
              exists = True
          except Exception:
              exists = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"exists={'true' if exists else 'false'}\n")
          print(f"graphviagent {version} exists={exists}")
          PY

      - name: Publish
        if: steps.version.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*
