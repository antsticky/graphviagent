[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphviagent"
version = "1.1.3-dev"
description = "Local Graph-View-Agent for inspecting and replaying LangGraph pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "antsticky" }]
keywords = ["langgraph", "langchain", "observability", "debugger", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "langgraph>=0.2",
    "watchdog>=4",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
graphviagent = "graphviagent.cli:main"

[project.urls]
Homepage = "https://github.com/antsticky/graphviagent"
Repository = "https://github.com/antsticky/graphviagent"
Issues = "https://github.com/antsticky/graphviagent/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
